<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lakáskezelő — Új jelszó</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:360px;}
  .login-box h1{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-0.01em;margin-bottom:24px;text-align:center;}
  .back-link{display:block;text-align:center;margin-top:20px;font-size:13.5px;color:var(--ink-soft);}
  .back-link:hover{color:var(--ink);}
</style>
</head>
<body>

<div class="login-box">
  <h1>Új jelszó beállítása</h1>

  <div class="form-error" id="form-error"></div>
  <div class="form-success" id="form-success"></div>
  <form id="reset-form">
    <div class="field">
      <label for="new-password">Új jelszó</label>
      <input type="password" id="new-password" autocomplete="new-password" minlength="8" required>
      <span class="hint">Legalább 8 karakter.</span>
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Jelszó mentése</button>
  </form>

  <a class="back-link" href="login.html">← Vissza a bejelentkezéshez</a>
</div>

<script src="app.js"></script>
<script>
  const token = new URLSearchParams(location.search).get('token');
  if (!token) {
    document.getElementById('form-error').textContent = 'Hiányzó vagy érvénytelen link.';
    document.getElementById('form-error').classList.add('show');
    document.getElementById('reset-form').style.display = 'none';
  }

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('form-error');
    const successEl = document.getElementById('form-success');
    errorEl.classList.remove('show');
    successEl.classList.remove('show');
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Mentés...';

    try {
      const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: document.getElementById('new-password').value }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.message || 'Hiba történt.';
        errorEl.classList.add('show');
        return;
      }
      successEl.textContent = 'A jelszó megváltozott. Most már bejelentkezhetsz.';
      successEl.classList.add('show');
      document.getElementById('reset-form').style.display = 'none';
    } catch (err) {
      errorEl.textContent = 'Nem sikerült elérni a szervert.';
      errorEl.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Jelszó mentése';
    }
  });
</script>
</body>
</html>
