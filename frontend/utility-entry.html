<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rezsi felvétel | Lakáskezelő</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="charts.css">
<style>
  .context-row{display:grid;grid-template-columns:160px;gap:12px;margin-bottom:16px;}
  .picker-chevron{width:18px;height:18px;color:var(--muted);display:block;margin-left:auto;}
  #picker-tbody tr.is-inactive .cell-main{color:var(--muted);}
  .page-header .btn svg{width:16px;height:16px;}
  /* Telefonon a választólista kártyaszerű sorokká alakul (nincs oldalirányú görgetés). */
  @media (max-width:720px){
    #ue-picker .card-table{overflow:visible;}
    #ue-picker table{min-width:0;width:100%;}
    #ue-picker thead{display:none;}
    #ue-picker table,#ue-picker tbody{display:block;}
    #ue-picker tbody tr{display:grid;grid-template-columns:1fr auto;column-gap:12px;row-gap:6px;padding:14px 16px;border-bottom:1px solid var(--line);}
    #ue-picker tbody tr:last-child{border-bottom:0;}
    #ue-picker tbody td{display:block;padding:0;border:0;}
    #ue-picker tbody td:nth-child(-n+3){grid-column:1;}
    #ue-picker tbody td:nth-child(4){grid-column:2;grid-row:1 / span 3;align-self:center;}
    #ue-picker tbody tr.empty-row{display:block;}
    .page-header{flex-wrap:wrap;}
  }
  .chart-total{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-0.02em;text-align:right;}
  .chart-total small{display:block;font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;}
  #chart-legend{margin:-4px 0 12px;}
  .next-tag{margin-left:8px;}
</style>
</head>
<body>

<div class="app">
  <script src="app.js"></script>
  <script src="nav.js"></script>
  <script src="utility-modal.js"></script>

  <main class="main">
    <div class="page-header">
      <div>
        <h1 id="ue-title">Rezsi felvétel</h1>
        <p id="ue-lead">Válaszd ki az ingatlant, amelyhez rezsit rögzítenél.</p>
      </div>
      <button class="btn btn-secondary" type="button" id="ue-back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="assets/icons/icons.svg#arrow-left"/></svg>Másik ingatlan</button>
    </div>

    <!-- 1. lépés: ingatlan választása (csak ha több van) -->
    <div id="ue-picker" hidden>
      <div class="card-table">
        <table>
          <thead><tr><th>Ingatlan</th><th>Következő bizonylat</th><th>Rezsi</th><th></th></tr></thead>
          <tbody id="picker-tbody"><tr class="empty-row"><td colspan="4">Betöltés...</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- 2. lépés: a kiválasztott ingatlan rezsije -->
    <div id="ue-entry" hidden>
    <div class="context-row">
      <div class="field"><label for="ue-year">Év</label><select id="ue-year"></select></div>
    </div>

    <section class="section viz-root">
      <div class="viz-head">
        <div>
          <h2 class="viz-title" id="chart-title">Havi rezsi bontás</h2>
          <p class="viz-sub">Tételenként egymásra rakva. Kattints egy hónapra a tételek megnyitásához.</p>
        </div>
        <div class="chart-total" id="chart-total"></div>
      </div>
      <div class="viz-legend" id="chart-legend"></div>
      <div class="viz-plot" id="chart-plot"></div>
    </section>

    <div class="card-table">
        <table>
          <thead><tr><th>Hónap</th><th>Tételek</th><th>Összeg</th><th>Állapot</th></tr></thead>
          <tbody id="months-tbody"><tr class="empty-row"><td colspan="4">Betöltés...</td></tr></tbody>
        </table>
    </div>
    </div>
  </main>
</div>

<script src="charts.js"></script>
<script>
requireAuth();

const yearInput = document.getElementById('ue-year');
let properties = [];
let current = null; // a kiválasztott ingatlan

let lastChart = null; // { entries, year } — átméretezéskor újrarajzoljuk

// Két lépés: több ingatlannál előbb a választólista, utána a kiválasztott ingatlan rezsije (?id=… a címben, így a
// böngésző Vissza gombja a listára visz). Egy ingatlannál a lista kimarad.
async function loadProperties() {
  const res = await apiFetch('/api/properties');
  properties = (await res.json()).sort((a, b) => (b.isActive - a.isActive) || a.name.localeCompare(b.name, 'hu'));
  route();
}

function route() {
  const id = new URLSearchParams(location.search).get('id');
  const selected = properties.find((p) => p.id === id) || (properties.length === 1 ? properties[0] : null);
  if (selected) showEntry(selected);
  else showPicker();
}

function showPicker() {
  current = null;
  document.getElementById('um-overlay')?.classList.remove('open'); // böngésző Vissza nyitott ablaknál
  document.title = 'Rezsi felvétel | Lakáskezelő';
  document.getElementById('ue-title').textContent = 'Rezsi felvétel';
  document.getElementById('ue-lead').textContent = 'Válaszd ki az ingatlant, amelyhez rezsit rögzítenél.';
  document.getElementById('ue-back').hidden = true;
  document.getElementById('ue-entry').hidden = true;
  document.getElementById('ue-picker').hidden = false;
  const tbody = document.getElementById('picker-tbody');
  if (!properties.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="4">Még nincs ingatlan. Az Ingatlanok oldalon vehetsz fel.</td></tr>';
    return;
  }
  tbody.innerHTML = properties.map((p) => `
    <tr class="clickable${p.isActive ? '' : ' is-inactive'}" data-pick="${escapeHtml(p.id)}" tabindex="0">
      <td class="cell-main">${escapeHtml(p.name)}${p.tenantNames ? `<div class="cell-sub">${escapeHtml(p.tenantNames)}</div>` : ''}</td>
      <td>${p.isActive ? `${p.nextPeriodYear}. ${MONTH_NAMES[p.nextPeriodMonth - 1].toLowerCase()}<div class="cell-sub">kiállítás: ${formatDate(p.nextBillingAt)}</div>` : '<span class="status-tag inactive">Inaktív</span>'}</td>
      <td>${!p.isActive ? '' : utilityStateTag(p.utilityState, 'Rögzítve')}</td>
      <td><svg class="picker-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="assets/icons/icons.svg#chevron-right"/></svg></td>
    </tr>`).join('');
  tbody.querySelectorAll('[data-pick]').forEach((row) => {
    const pick = () => { history.pushState(null, '', `?id=${encodeURIComponent(row.dataset.pick)}`); route(); };
    row.addEventListener('click', pick);
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  });
}

async function showEntry(property) {
  current = property;
  document.title = `Rezsi: ${property.name} | Lakáskezelő`;
  document.getElementById('ue-title').textContent = property.name;
  document.getElementById('ue-lead').textContent = 'Kattints egy hónapra a rezsi tételek felvételéhez vagy megtekintéséhez.';
  document.getElementById('ue-back').hidden = properties.length < 2;
  document.getElementById('ue-picker').hidden = true;
  document.getElementById('ue-entry').hidden = false;
  // Csak az aktuális és a következő év választható: ezekre van a rezsi előre kitöltve.
  const thisYear = new Date().getFullYear();
  const years = [thisYear, thisYear + 1];
  yearInput.innerHTML = years.map((y) => `<option value="${y}">${y}</option>`).join('');
  yearInput.value = String(years.includes(property.nextPeriodYear) ? property.nextPeriodYear : thisYear);
  await loadMonths();
}

document.getElementById('ue-back').addEventListener('click', () => {
  history.pushState(null, '', location.pathname);
  route();
});
window.addEventListener('popstate', () => route());

async function loadMonths() {
  if (!current) return;
  const propertyId = current.id;
  const year = Number(yearInput.value);

  const entries = await (await apiFetch(`/api/properties/${propertyId}/utility-costs`)).json();


  // A következő kiküldés időszaka (annak a rezsije kerül a bizonylatra) — a táblázatban jelöljük.
  const property = current;
  // Egy hónap csúszással fizető bérlőnél ez az előző hónap (utilityPeriod…).
  const isNext = (month) => property && property.isActive
    && (property.utilityPeriodYear || property.nextPeriodYear) === year && (property.utilityPeriodMonth || property.nextPeriodMonth) === month;

  const tbody = document.getElementById('months-tbody');
  tbody.innerHTML = MONTH_NAMES.map((name, idx) => {
    const month = idx + 1;
    const monthEntries = entries.filter((e) => e.year === year && e.month === month);
    const sum = monthEntries.reduce((acc, e) => acc + e.amount, 0);
    const statusTag = utilityPeriodTag(monthEntries);

    return `
      <tr class="clickable" onclick="openMonth(${month})">
        <td class="cell-main">${name}${isNext(month) ? '<span class="status-tag warn next-tag" title="Ennek a hónapnak a rezsije kerül a következő bizonylatra">következő bizonylat</span>' : ''}</td>
        <td>${monthEntries.length}</td>
        <td>${monthEntries.length > 0 ? formatCurrency(sum) : '–'}</td>
        <td>${statusTag}</td>
      </tr>
    `;
  }).join('');

  renderChart(entries, year);
}

// Havi rezsi bontás — egymásra rakott oszlopok tételenként (a közös charts.js-szel, mint a Vezérlőpulton).
// A megnevezéseket kis-nagybetűtől függetlenül csoportosítjuk; a legnagyobb öt tétel saját színt kap, a többi
// „Egyéb”-be kerül (több szín már nem különböztethető meg biztosan). Egy tétel az egész évben ugyanazt a színt
// kapja, hogy a hónapok összevethetők legyenek.
function renderChart(allEntries, year) {
  lastChart = { allEntries, year };
  const { renderColumns, legend, categoryColor, huf } = VizCharts;
  const plot = document.getElementById('chart-plot');
  const yearEntries = allEntries.filter((e) => e.year === year);

  const groups = new Map(); // kisbetűs kulcs → { name, total }
  for (const e of yearEntries) {
    const name = (e.label || '').trim() || 'Egyéb';
    const key = name.toLowerCase();
    const g = groups.get(key) || { name, total: 0 };
    g.total += Number(e.amount);
    groups.set(key, g);
  }
  const ranked = [...groups.entries()].sort((a, b) => b[1].total - a[1].total || a[1].name.localeCompare(b[1].name, 'hu'));
  const top = ranked.length > 6 ? ranked.slice(0, 5) : ranked;
  const topKeys = new Map(top.map(([key, g]) => [key, g.name]));
  const categories = top.map(([, g]) => g.name);
  const otherName = topKeys.get('egyéb') || 'Egyéb';
  if (ranked.length > top.length && !categories.includes(otherName)) categories.push(otherName);
  const categoryOf = (label) => topKeys.get(((label || '').trim() || 'Egyéb').toLowerCase()) || otherName;

  const series = categories.map((name, i) => ({
    name,
    color: categoryColor(plot, i, name === otherName && ranked.length > top.length && i === categories.length - 1),
    values: MONTH_NAMES.map((_, m) => yearEntries
      .filter((e) => e.month === m + 1 && categoryOf(e.label) === name)
      .reduce((sum, e) => sum + Number(e.amount), 0)),
  }));
  const totals = MONTH_NAMES.map((_, m) => series.reduce((sum, s) => sum + s.values[m], 0));
  const yearTotal = totals.reduce((a, b) => a + b, 0);

  document.getElementById('chart-title').textContent = `Havi rezsi bontás (${year})`;
  document.getElementById('chart-total').innerHTML = yearTotal > 0
    ? `${escapeHtml(huf(yearTotal))}<small>összesen az évben</small>` : '';
  legend(document.getElementById('chart-legend'), series);
  renderColumns(plot, {
    series,
    stacked: true,
    capTotal: true,
    emptyText: 'Ebben az évben még nincs rögzített rezsi tétel.',
    ariaLabel: `Havi rezsi bontás tételenként, ${year}`,
    tooltip: (m) => ({
      title: `${MONTH_NAMES[m]} ${year}`,
      rows: series.slice().reverse().filter((s) => s.values[m] > 0).map((s) => ({ color: s.color, label: s.name, value: huf(s.values[m]) })),
      foot: totals[m] > 0 ? `Összesen ${huf(totals[m])}. Kattints a tételekhez.` : 'Nincs tétel. Kattints a felvételhez.',
    }),
    onSelect: (m) => openMonth(m + 1),
  });
}

let chartResizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(chartResizeTimer);
  chartResizeTimer = setTimeout(() => { if (lastChart) renderChart(lastChart.allEntries, lastChart.year); }, 120);
});

window.openMonth = (month) => {
  const property = current;
  if (!property) return;
  openUtilityModal(property.id, property.name, Number(yearInput.value), month, { onClose: loadMonths, onSaved: loadMonths });
};

yearInput.addEventListener('input', loadMonths);

loadProperties();
</script>

</body>
</html>
