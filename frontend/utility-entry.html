<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lakáskezelő — Rezsi felvétel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .context-row{display:grid;grid-template-columns:2fr 1fr;gap:12px;max-width:520px;}

  .chart-legend{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:18px;}
  .chart-legend-item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .chart-swatch{width:10px;height:10px;display:inline-block;flex-shrink:0;}
  .chart-wrap{display:flex;align-items:flex-end;gap:6px;border-bottom:1px solid var(--line);padding-top:10px;}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;}
  .chart-bar{width:100%;display:flex;flex-direction:column;justify-content:flex-end;}
  .chart-bar-fill{width:100%;display:flex;flex-direction:column;}
  .chart-col-label{margin-top:8px;font-size:11px;color:var(--ink-soft);font-weight:600;}
</style>
</head>
<body>

<div class="app">
  <script src="app.js"></script>
  <script src="nav.js"></script>
  <script src="utility-modal.js"></script>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Rezsi felvétel</h1>
        <p>Válaszd ki az ingatlant és az évet, majd kattints egy hónapra a rezsi tételek felvételéhez vagy megtekintéséhez.</p>
      </div>
    </div>

    <section class="section">
      <div class="context-row">
        <div class="field"><label for="ue-property">Ingatlan</label><select id="ue-property"></select></div>
        <div class="field"><label for="ue-year">Év</label><input type="number" id="ue-year"></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <div>
          <h3>Havi rezsi bontás</h3>
          <p>Az oszlopok magassága a havi összeget, a színes szakaszok az egyes tételek arányát mutatják.</p>
        </div>
      </div>
      <div class="chart-legend" id="chart-legend"></div>
      <div class="chart-wrap" id="chart-wrap"></div>
    </section>

    <section class="section">
      <div class="card-table">
        <table>
          <thead><tr><th>Hónap</th><th>Tételek</th><th>Összeg</th><th>Állapot</th></tr></thead>
          <tbody id="months-tbody"><tr class="empty-row"><td colspan="4">Betöltés...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script>
requireAuth();

const propertySelect = document.getElementById('ue-property');
const yearInput = document.getElementById('ue-year');
let properties = [];

const CHART_COLORS = ['var(--accent)', 'var(--green)', 'var(--amber)', 'var(--coral)', '#7C3AED', '#0891B2'];
const CHART_HEIGHT = 220;

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s ?? '';
  return div.innerHTML;
}

async function loadProperties() {
  yearInput.value = new Date().getFullYear();

  const res = await apiFetch('/api/properties');
  properties = await res.json();
  propertySelect.innerHTML = properties.map((p) => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
  if (properties.length > 0) await loadMonths();
}

async function loadMonths() {
  const propertyId = propertySelect.value;
  if (!propertyId) return;
  const year = Number(yearInput.value);

  const [entriesRes, invoicesRes] = await Promise.all([
    apiFetch(`/api/properties/${propertyId}/utility-costs`),
    apiFetch(`/api/properties/${propertyId}/invoices`),
  ]);
  const entries = await entriesRes.json();
  const invoices = await invoicesRes.json();

  const lockedMonths = new Set(
    invoices.filter((i) => (i.status === 'Sent' || i.status === 'Generated') && i.periodYear === year).map((i) => i.periodMonth)
  );

  const tbody = document.getElementById('months-tbody');
  tbody.innerHTML = MONTH_NAMES.map((name, idx) => {
    const month = idx + 1;
    const monthEntries = entries.filter((e) => e.year === year && e.month === month);
    const sum = monthEntries.reduce((acc, e) => acc + e.amount, 0);
    const locked = lockedMonths.has(month);
    const statusTag = locked
      ? '<span class="status-tag ok">Lezárva</span>'
      : (monthEntries.length > 0 ? '<span class="status-tag ok">Rögzítve</span>' : '<span class="status-tag missing">Nincs adat</span>');

    return `
      <tr class="clickable" onclick="openMonth(${month})">
        <td class="cell-main">${name}</td>
        <td>${monthEntries.length}</td>
        <td>${monthEntries.length > 0 ? formatCurrency(sum) : '—'}</td>
        <td>${statusTag}</td>
      </tr>
    `;
  }).join('');

  renderChart(entries, year);
}

// Havi oszlopdiagram — soronként a hónap teljes rezsi összegével arányos magasságú oszlop, azon
// belül a tételek (megnevezés) arányában színezett szakaszokkal. Minden megnevezés a teljes
// naptári éven belül ugyanazt a színt kapja, hogy a diagram hónapok között is összehasonlítható
// legyen.
function renderChart(allEntries, year) {
  const yearEntries = allEntries.filter((e) => e.year === year);
  const labels = [...new Set(yearEntries.map((e) => e.label))].sort((a, b) => a.localeCompare(b, 'hu'));
  const colorByLabel = new Map(labels.map((l, i) => [l, CHART_COLORS[i % CHART_COLORS.length]]));

  const legendEl = document.getElementById('chart-legend');
  legendEl.innerHTML = labels.length === 0
    ? '<span class="hint">Nincs még rögzített rezsi tétel ebben az évben.</span>'
    : labels.map((l) => `<span class="chart-legend-item"><span class="chart-swatch" style="background:${colorByLabel.get(l)}"></span>${escapeHtml(l)}</span>`).join('');

  const monthTotals = MONTH_NAMES.map((_, idx) => {
    const month = idx + 1;
    const monthEntries = yearEntries.filter((e) => e.month === month);
    return { month, total: monthEntries.reduce((acc, e) => acc + e.amount, 0), entries: monthEntries };
  });
  const maxTotal = Math.max(1, ...monthTotals.map((m) => m.total));

  document.getElementById('chart-wrap').innerHTML = monthTotals.map(({ month, total, entries: monthEntries }) => {
    const barHeight = total > 0 ? Math.max(4, (total / maxTotal) * CHART_HEIGHT) : 0;
    const segs = monthEntries.slice().sort((a, b) => a.label.localeCompare(b.label, 'hu')).map((e) => {
      const segHeight = total > 0 ? (e.amount / total) * barHeight : 0;
      return `<div class="chart-seg" style="height:${segHeight}px;background:${colorByLabel.get(e.label)}" title="${escapeHtml(e.label)}: ${formatCurrency(e.amount)}"></div>`;
    }).join('');

    return `
      <div class="chart-col">
        <div class="chart-bar" style="height:${CHART_HEIGHT}px;">
          <div class="chart-bar-fill" style="height:${barHeight}px;" title="${MONTH_NAMES[month - 1]}: ${formatCurrency(total)}">${segs}</div>
        </div>
        <div class="chart-col-label">${MONTH_NAMES[month - 1].slice(0, 3)}</div>
      </div>
    `;
  }).join('');
}

window.openMonth = (month) => {
  const property = properties.find((p) => p.id === propertySelect.value);
  if (!property) return;
  openUtilityModal(property.id, property.name, Number(yearInput.value), month, { onClose: loadMonths, onSaved: loadMonths });
};

propertySelect.addEventListener('change', loadMonths);
yearInput.addEventListener('input', loadMonths);

loadProperties();
</script>

</body>
</html>
