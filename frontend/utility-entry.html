<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lakáskezelő — Rezsi felvétel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .context-row{display:grid;grid-template-columns:2fr 1fr;gap:12px;max-width:520px;}
</style>
</head>
<body>

<div class="app">
  <script src="app.js"></script>
  <script src="nav.js"></script>
  <script src="utility-modal.js"></script>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Rezsi felvétel</h1>
        <p>Válaszd ki az ingatlant és az évet, majd kattints egy hónapra a rezsi tételek felvételéhez vagy megtekintéséhez.</p>
      </div>
    </div>

    <section class="section">
      <div class="context-row">
        <div class="field"><label for="ue-property">Ingatlan</label><select id="ue-property"></select></div>
        <div class="field"><label for="ue-year">Év</label><input type="number" id="ue-year"></div>
      </div>
    </section>

    <section class="section">
      <div class="card-table">
        <table>
          <thead><tr><th>Hónap</th><th>Tételek</th><th>Összeg</th><th>Állapot</th></tr></thead>
          <tbody id="months-tbody"><tr class="empty-row"><td colspan="4">Betöltés...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script>
requireAuth();

const propertySelect = document.getElementById('ue-property');
const yearInput = document.getElementById('ue-year');
let properties = [];

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s ?? '';
  return div.innerHTML;
}

async function loadProperties() {
  yearInput.value = new Date().getFullYear();

  const res = await apiFetch('/api/properties');
  properties = await res.json();
  propertySelect.innerHTML = properties.map((p) => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
  if (properties.length > 0) await loadMonths();
}

async function loadMonths() {
  const propertyId = propertySelect.value;
  if (!propertyId) return;
  const year = Number(yearInput.value);

  const [entriesRes, invoicesRes] = await Promise.all([
    apiFetch(`/api/properties/${propertyId}/utility-costs`),
    apiFetch(`/api/properties/${propertyId}/invoices`),
  ]);
  const entries = await entriesRes.json();
  const invoices = await invoicesRes.json();

  const lockedMonths = new Set(
    invoices.filter((i) => (i.status === 'Sent' || i.status === 'Generated') && i.periodYear === year).map((i) => i.periodMonth)
  );

  const tbody = document.getElementById('months-tbody');
  tbody.innerHTML = MONTH_NAMES.map((name, idx) => {
    const month = idx + 1;
    const monthEntries = entries.filter((e) => e.year === year && e.month === month);
    const sum = monthEntries.reduce((acc, e) => acc + e.amount, 0);
    const locked = lockedMonths.has(month);
    const statusTag = locked
      ? '<span class="status-tag ok">Lezárva</span>'
      : (monthEntries.length > 0 ? '<span class="status-tag ok">Rögzítve</span>' : '<span class="status-tag missing">Nincs adat</span>');

    return `
      <tr class="clickable" onclick="openMonth(${month})">
        <td class="cell-main">${name}</td>
        <td>${monthEntries.length}</td>
        <td>${monthEntries.length > 0 ? formatCurrency(sum) : '—'}</td>
        <td>${statusTag}</td>
      </tr>
    `;
  }).join('');
}

window.openMonth = (month) => {
  const property = properties.find((p) => p.id === propertySelect.value);
  if (!property) return;
  openUtilityModal(property.id, property.name, Number(yearInput.value), month, { onClose: loadMonths, onSaved: loadMonths });
};

propertySelect.addEventListener('change', loadMonths);
yearInput.addEventListener('input', loadMonths);

loadProperties();
</script>

</body>
</html>
