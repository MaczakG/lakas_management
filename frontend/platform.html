<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platform admin — Cégek</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
<style>
  .platform-form{max-width:720px;}
  .platform-form .section{margin-bottom:20px;}
  .switch-row{display:flex;align-items:flex-start;gap:12px;}
  .switch-row input{margin-top:3px;width:18px;height:18px;}
  .switch-row strong{display:block;color:var(--ink);font-size:14px;}
  .switch-row span{font-size:12.5px;color:var(--ink-soft);}
  .inline-test{display:flex;gap:10px;align-items:flex-end;margin-bottom:8px;}
  .inline-test .field{flex:1;margin-bottom:0;}
  .test-result{font-size:13px;font-weight:600;margin-top:8px;}
  .test-result.ok{color:var(--green);}
  .test-result.error{color:var(--coral);}
</style>
</head>
<body>

<div class="app">
  <script src="app.js"></script>
  <script src="platform-session.js"></script>
  <script src="platform-nav.js"></script>

  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-eyebrow">Platform admin</div>
        <h1>Cégek</h1>
        <div class="page-state" id="page-state"></div>
      </div>
    </div>

    <div class="form-error" id="page-error"></div>
    <div class="form-success" id="page-success"></div>

    <section class="section">
      <div class="card-table">
        <table>
          <thead><tr><th>Cég</th><th>Regisztrált</th><th class="num">Felhasználó</th><th class="num">Aktív ingatlan</th><th>Állapot</th><th>Érvényes</th><th class="num">Befizetve</th><th></th></tr></thead>
          <tbody id="companies-tbody"><tr class="empty-row"><td colspan="8">Betöltés...</td></tr></tbody>
        </table>
      </div>
      <p class="hint" style="margin-top:12px;" id="billing-note"></p>
    </section>
  </main>
</div>

<script>
requireAuth();
const $ = (id) => document.getElementById(id);
const huf = (n) => `${Math.round(n).toLocaleString('hu-HU')} Ft`;
const day = (d) => (d ? new Date(d).toLocaleDateString('hu-HU') : '—');
function show(id, text) { $(id).textContent = text; $(id).classList.toggle('show', !!text); }
function secret(id, isSet) {
  $(id).value = '';
  $(id).placeholder = isSet ? '•••••••• (beállítva — üresen hagyva nem változik)' : 'nincs beállítva';
}
// A platform beállítás-sora egyben mentődik: betöltjük, a lap a saját mezőit átírja, és visszaküldjük
// (a titkos kulcsok üresen maradva nem változnak).
async function getPlatformSettings() {
  const res = await apiFetch('/api/platform/settings');
  const s = await readJson(res);
  if (!res.ok) throw new Error(errorMessage(res, s, 'Nem sikerült betölteni.'));
  return s;
}
async function savePlatformSettings(s, overrides) {
  const payload = {
    billingEnabled: s.billingEnabled, monthlyPricePerProperty: s.monthlyPricePerProperty, pricesIncludeVat: s.pricesIncludeVat,
    yearlyDiscountPercent: s.yearlyDiscountPercent, trialDays: s.trialDays, graceDays: s.graceDays, vatPercent: s.vatPercent,
    vatExemption: s.vatExemption, barionEnvironment: s.barionEnvironment, barionPosKey: null, barionPayeeEmail: s.barionPayeeEmail,
    billingoApiKey: null, billingoBlockId: s.billingoBlockId, operator: s.operator, termsVersion: s.termsVersion,
    ...overrides,
  };
  const res = await apiFetch('/api/platform/settings', { method: 'PUT', body: JSON.stringify(payload) });
  const body = await readJson(res);
  if (!res.ok) throw new Error(errorMessage(res, body, 'Nem sikerült menteni.'));
  return body;
}
const STATUS = { Trial: ['Próbaidő', 'warn'], Active: ['Aktív', 'ok'], PastDue: ['Fizetés sikertelen', 'warn'], Locked: ['Csak olvasható', 'missing'] };
async function load() {
  const [cres, settings] = await Promise.all([apiFetch('/api/platform/companies'), getPlatformSettings().catch(() => null)]);
  const companies = await readJson(cres);
  if (!cres.ok) { show('page-error', errorMessage(cres, companies, 'Nem sikerült betölteni.')); return; }
  $('billing-note').textContent = settings && !settings.billingEnabled
    ? 'A díjszedés ki van kapcsolva (Díjak és fizetés) — most minden cég ingyen használja a rendszert.' : '';
  setPageState([
    { n: companies.length, label: 'cég' },
    { n: companies.filter((c) => c.status === 'Active').length, label: 'fizető', tone: 'ok' },
    { n: companies.filter((c) => c.status === 'Trial').length, label: 'próbaidős', tone: 'warn' },
    { n: companies.filter((c) => c.status === 'Locked').length, label: 'csak olvasható' },
  ]);
  $('companies-tbody').innerHTML = companies.map((c) => {
    const [label, tone] = c.isOperator ? ['Üzemeltető', 'ok'] : (STATUS[c.status] || ['—', '']);
    const until = c.status === 'Trial' ? c.trialEndsAt : c.paidUntil;
    return `<tr>
      <td class="cell-main">${escapeHtml(c.name)}</td>
      <td>${day(c.createdAt)}</td>
      <td class="num">${c.users}</td>
      <td class="num">${c.activeProperties}</td>
      <td><span class="status-tag ${tone}">${escapeHtml(label)}</span>${c.interval ? ` <span class="hint">${c.interval === 'Yearly' ? 'éves' : 'havi'}</span>` : ''}</td>
      <td>${c.isOperator ? '—' : day(until)}</td>
      <td class="num">${huf(c.paidTotal)}</td>
      <td class="row-actions">${c.isOperator ? '' : `<button class="btn btn-ghost btn-sm" type="button" onclick="extendCompany(${jsArg(c.id)}, ${jsArg(c.name)})">+ díjmentes napok</button>`}</td>
    </tr>`;
  }).join('') || '<tr class="empty-row"><td colspan="8">Nincs cég.</td></tr>';
}

window.extendCompany = async (id, name) => {
  const input = prompt(`Hány díjmentes napot írjunk jóvá: ${name}?\n(Próbaidőben a próbaidőt, fizetőnél a kifizetett időszakot hosszabbítja; zárolt cégnél újraindítja.)`, '14');
  if (!input) return;
  const res = await apiFetch(`/api/platform/companies/${id}/extend`, { method: 'POST', body: JSON.stringify({ days: parseInt(input, 10) }) });
  const body = await readJson(res);
  if (!res.ok) { show('page-error', errorMessage(res, body, 'Nem sikerült.')); return; }
  show('page-success', `${name}: ${body.message}`);
  await load();
};

load();
</script>
</body>
</html>
