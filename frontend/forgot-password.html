<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elfelejtett jelszó | Lakáskezelő</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:400px;}
  .login-box h1{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-0.01em;margin-bottom:8px;text-align:center;}
  .login-box .sub{color:var(--ink-soft);font-size:13.5px;text-align:center;margin-bottom:24px;}
  .back-link{display:block;text-align:center;margin-top:20px;font-size:13.5px;color:var(--ink-soft);}
  .back-link:hover{color:var(--ink);}
</style>
</head>
<body>

<div class="login-box">
  <div class="login-brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="assets/icons/icons.svg#house"/></svg></span><span class="brand-name">Lakáskezelő</span></div>
  <h1>Elfelejtett jelszó</h1>
  <p class="sub">Add meg az e-mail címed. Ha van hozzá fiók, küldünk egy visszaállító linket.</p>

  <div class="form-error" id="form-error"></div>
  <div class="form-success" id="form-success"></div>
  <form id="forgot-form">
    <div class="field">
      <label for="email">E-mail cím</label>
      <input type="email" id="email" autocomplete="email" required>
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Visszaállító link küldése</button>
  </form>

  <a class="back-link" href="login.html">← Vissza a bejelentkezéshez</a>
</div>

<script src="app.js"></script>
<script>
  document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('form-error');
    const successEl = document.getElementById('form-success');
    errorEl.classList.remove('show');
    successEl.classList.remove('show');
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Küldés...';

    try {
      const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value }),
      });
      const data = await readJson(res);
      if (!res.ok) {
        errorEl.textContent = errorMessage(res, data, 'Hiba történt.');
        errorEl.classList.add('show');
        return;
      }
      successEl.textContent = data.message;
      successEl.classList.add('show');
      document.getElementById('forgot-form').reset();
    } catch (err) {
      errorEl.textContent = 'Nem sikerült elérni a szervert.';
      errorEl.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Visszaállító link küldése';
    }
  });
</script>
</body>
</html>
