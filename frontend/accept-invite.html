<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meghívó | Lakáskezelő</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:420px;}
  .login-box h1{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-0.01em;margin-bottom:10px;text-align:center;}
  .login-box .lead{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:24px;}
</style>
</head>
<body>

<div class="login-box">
  <div class="login-brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="assets/icons/icons.svg#house"/></svg></span><span class="brand-name">Lakáskezelő</span></div>
  <h1>Meghívó elfogadása</h1>
  <p class="lead" id="lead">Egy pillanat...</p>

  <div class="form-error" id="form-error"></div>
  <div class="form-success" id="form-success"></div>
  <form id="accept-form" hidden>
    <div class="field">
      <label for="email">E-mail cím</label>
      <input type="email" id="email" autocomplete="username" readonly>
    </div>
    <div class="field">
      <label for="full-name">A neved</label>
      <input type="text" id="full-name" autocomplete="name" minlength="2" maxlength="200" required>
    </div>
    <div class="field">
      <label for="password">Jelszó</label>
      <input type="password" id="password" autocomplete="new-password" minlength="8" maxlength="200" required>
      <span class="hint">Legalább 8 karakter.</span>
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Jelszó beállítása és csatlakozás</button>
  </form>
  <a class="btn btn-primary btn-block" href="login.html" id="login-btn" hidden>Tovább a bejelentkezéshez</a>
</div>

<script src="app.js"></script>
<script>
  function showMsg(id, text) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.classList.add('show');
  }
  function hideMsgs() {
    document.querySelectorAll('.form-error, .form-success').forEach((el) => el.classList.remove('show'));
  }
  async function postJson(path, body) {
    const res = await fetch(`${API_BASE}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return { res, data: await readJson(res) };
  }

  const token = new URLSearchParams(location.search).get('token');
  const lead = document.getElementById('lead');
  const form = document.getElementById('accept-form');

  (async () => {
    if (!token) {
      lead.hidden = true;
      showMsg('form-error', 'Hiányzó vagy érvénytelen link.');
      return;
    }
    try {
      const { res, data } = await postJson('/api/auth/invite-info', { token });
      if (!res.ok) {
        lead.hidden = true;
        showMsg('form-error', errorMessage(res, data, 'A meghívó érvénytelen vagy lejárt.'));
        return;
      }
      lead.textContent = `Meghívtak a(z) ${data.companyName} csapatába. Állítsd be a jelszavadat a belépéshez.`;
      document.getElementById('email').value = data.email;
      document.getElementById('full-name').value = data.fullName || '';
      form.hidden = false;
    } catch {
      lead.hidden = true;
      showMsg('form-error', 'Nem sikerült elérni a szervert.');
    }
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsgs();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    try {
      const { res, data } = await postJson('/api/auth/accept-invite', {
        token,
        fullName: document.getElementById('full-name').value.trim(),
        password: document.getElementById('password').value,
      });
      if (!res.ok) {
        showMsg('form-error', errorMessage(res, data, 'Nem sikerült elfogadni a meghívót.'));
        return;
      }
      form.hidden = true;
      lead.hidden = true;
      showMsg('form-success', data.message);
      const loginBtn = document.getElementById('login-btn');
      loginBtn.href = `login.html?email=${encodeURIComponent(data.email)}`;
      loginBtn.hidden = false;
    } catch {
      showMsg('form-error', 'Nem sikerült elérni a szervert.');
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
