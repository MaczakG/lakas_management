<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dokumentum | Lakáskezelő</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="detail.css">
<link rel="stylesheet" href="documents.css">
</head>
<body>

<div class="app">
  <script src="app.js"></script>
  <script src="nav.js"></script>

  <main class="main">
    <!-- A dokumentum adatlapja: bal oldalon az adatai (helyben szerkeszthetők), a verziók és a napló, jobb oldalon az
         előnézet. -->
    <div class="detail-page doc-detail-page">
      <div class="detail-head">
        <div class="detail-head-text">
          <ol class="crumbs" id="crumbs"></ol>
          <div class="title-row">
            <h1 id="d-name">Betöltés…</h1>
          </div>
          <p class="detail-sub" id="d-sub"></p>
        </div>
        <div class="detail-actions">
          <button class="btn btn-secondary btn-sm" type="button" id="download-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="assets/icons/icons.svg#download"/></svg>Letöltés</button>
          <button class="btn btn-secondary btn-sm" type="button" id="version-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="assets/icons/icons.svg#upload"/></svg><span>Új verzió</span></button>
          <button class="btn btn-danger btn-sm" type="button" id="delete-btn">Törlés</button>
        </div>
      </div>

      <div class="form-error" id="load-error"></div>

      <div class="doc-detail">
        <div class="doc-side">
          <section class="panel">
            <div class="panel-head">
              <h2 class="panel-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="assets/icons/icons.svg#file-text"/></svg>Adatok</h2>
              <button class="btn btn-secondary" type="button" id="types-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="assets/icons/icons.svg#tag"/></svg>Típusok</button>
            </div>
            <dl class="panel-body props" id="props"></dl>
          </section>
          <section class="panel">
            <div class="panel-head"><h2 class="panel-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="assets/icons/icons.svg#history"/></svg>Verziók <span class="panel-count" id="count-versions"></span></h2></div>
            <div class="doc-versions" id="versions"></div>
          </section>
          <section class="panel">
            <div class="panel-head">
              <h2 class="panel-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="assets/icons/icons.svg#clipboard-list"/></svg>Napló</h2>
              <button class="btn btn-secondary" type="button" id="log-all-btn" hidden>Teljes napló</button>
            </div>
            <div class="doc-log" id="log"></div>
          </section>
        </div>

        <section class="panel doc-preview">
          <div class="panel-head">
            <h2 class="panel-title doc-preview-title" id="pv-title">Előnézet</h2>
            <div class="pv-zoom" id="pv-zoom" hidden>
              <button class="icon-btn" type="button" id="zoom-out" title="Kicsinyítés" aria-label="Kicsinyítés"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/icons.svg#minus"/></svg></button>
              <button class="pv-zoom-val" type="button" id="zoom-val" title="Vissza 60%-ra">60%</button>
              <button class="icon-btn" type="button" id="zoom-in" title="Nagyítás" aria-label="Nagyítás"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/icons.svg#plus"/></svg></button>
            </div>
          </div>
          <div class="dv-stage" id="pv-stage"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<script src="record-detail.js"></script>
<script src="documents.js"></script>
<script src="document-detail.js"></script>
</body>
</html>
