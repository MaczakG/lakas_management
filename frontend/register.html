<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lakáskezelő — Regisztráció</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:440px;}
  .login-box h1{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-0.01em;margin-bottom:10px;text-align:center;}
  .login-box .lead{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:24px;}
</style>
</head>
<body>

<div class="login-box">
  <div class="login-brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="assets/icons/icons.svg#house"/></svg></span><span class="brand-name">Lakáskezelő</span></div>
  <h1>Regisztráció</h1>
  <p class="lead">Hozd létre a céged fiókját — utána meghívhatod a kollégáidat is.</p>

  <div class="form-error" id="form-error"></div>
  <div class="form-success" id="form-success"></div>
  <form id="register-form">
    <div class="field">
      <label for="company">Cég vagy magánszemély neve</label>
      <input type="text" id="company" autocomplete="organization" minlength="2" maxlength="200" required>
      <span class="hint">Ez jelenik meg a felületen; a számlakibocsátó adatait később a Beállításokban adod meg.</span>
    </div>
    <div class="field">
      <label for="full-name">A neved</label>
      <input type="text" id="full-name" autocomplete="name" minlength="2" maxlength="200" required>
    </div>
    <div class="field">
      <label for="email">E-mail cím</label>
      <input type="email" id="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Jelszó</label>
      <input type="password" id="password" autocomplete="new-password" minlength="8" maxlength="200" required>
      <span class="hint">Legalább 8 karakter.</span>
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Fiók létrehozása</button>
  </form>

  <p class="auth-alt">Már van fiókod? <a href="login.html">Bejelentkezés</a></p>
</div>

<script src="app.js"></script>
<script>
  function showMsg(id, text) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.classList.add('show');
  }
  function hideMsgs() {
    document.querySelectorAll('.form-error, .form-success').forEach((el) => el.classList.remove('show'));
  }
  async function postJson(path, body) {
    const res = await fetch(`${API_BASE}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return { res, data: await readJson(res) };
  }

  APP_INFO.then((v) => {
    if (v.version && !v.registrationEnabled) {
      showMsg('form-error', 'A regisztráció jelenleg nem elérhető.');
      document.getElementById('register-form').hidden = true;
    }
  });

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsgs();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Létrehozás...';
    try {
      const { res, data } = await postJson('/api/auth/register', {
        companyName: document.getElementById('company').value.trim(),
        fullName: document.getElementById('full-name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });
      if (!res.ok) {
        showMsg('form-error', errorMessage(res, data, 'Nem sikerült a regisztráció.'));
        return;
      }
      showMsg('form-success', data.message);
      document.getElementById('register-form').hidden = true;
    } catch {
      showMsg('form-error', 'Nem sikerült elérni a szervert.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Fiók létrehozása';
    }
  });
</script>
</body>
</html>
