# Éles nginx-konfiguráció (EC2: /home/ubuntu/lakaskezelo/nginx.conf → a konténerben
# /etc/nginx/conf.d/default.conf). A http blokkon belül töltődik be, ezért a server_tokens és a
# limit_req_zone itt, a server blokkok előtt áll.

server_tokens off;

# Bejelentkezési végpontok: IP-címenként átlagosan 10 kérés/perc (kis löketet engedve). A backend is
# korlátoz (AuthController.RateLimitPolicy) — ez a külső védvonal, ami a konténerig sem engedi a
# tömeges próbálkozást.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name lakaskezelo.alts.hu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lakaskezelo.alts.hu;

    ssl_certificate /etc/letsencrypt/live/lakaskezelo.alts.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lakaskezelo.alts.hu/privkey.pem;

    # Mozilla "intermediate" ajánlás: csak TLS 1.2/1.3, TLS 1.2-n csak előre titkos (ECDHE) AEAD
    # titkosítók.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 20m;

    # Biztonsági fejlécek minden válaszon (az "always" a hibaválaszokra is). Figyelem: ha egy
    # location blokk saját add_header-t kap, ezeket ott NEM örökli — ezért location szinten nincs
    # add_header.
    #  - HSTS: a böngésző egy évig csak HTTPS-en nyitja meg az oldalt.
    #  - CSP: szkript csak innen (a meglévő inline szkriptek miatt 'unsafe-inline'), betűkészlet csak
    #    a Google Fonts-ról, hálózati kérés (fetch) csak a saját szerverre, más oldal nem ágyazhatja be.
    #  - Cache-Control: no-cache — a böngésző minden betöltéskor rákérdez (ETag-gel, 304), így
    #    élesítés után sem marad régi oldal a gyorsítótárban.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8080/health;
    }

    # Rejtett fájlok (pl. véletlenül odakerült .git, .env) soha ne legyenek kiszolgálva.
    location ~ /\. {
        return 404;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
